/* DawaSafe Android — app/build.gradle
   ------------------------------------------------------------------------
   ZERO third-party dependencies, on purpose.

   Everything this app needs (WebView, AlarmManager, Notification) is in the
   Android framework. Adding androidx.core just for NotificationCompat would
   mean the build can fail on a dependency-resolution hiccup in CI, and the
   person running that CI is not going to be able to debug it. The extra
   ~40 lines of API-level branching in Notifier.java is a fair trade.
   ------------------------------------------------------------------------ */
plugins {
    id 'com.android.application'
}

/* ---------------------------------------------------------------------------
   SIGNING KEY — dawasafe-new.jks, resolved at build time, never committed.
   ---------------------------------------------------------------------------
   Rotated on 2026-08-15. This file used to carry a keystore path and all three
   passwords in plain text, next to a keystore committed at
   keystore/dawasafe.jks whose password was the word "dawasafe". Anyone with the
   repository therefore had everything needed to sign an APK that installs as
   an UPDATE over a real DawaSafe install — same certificate, no warning, no
   uninstall. For a medicine-reminder app that is the wrong thing to leave
   lying around.

   That key is now dead: it is replaced by dawasafe-new.jks, which lives only
   outside the repository. Because the certificate changed, an APK from this
   build will NOT install over an app signed by the old key — the old install
   has to be removed first. That is a one-time cost, paid deliberately, and it
   is why the workflow prints the new certificate fingerprint on every run.

   Two sources, checked in this order:

     1. Environment variables — what GitHub Actions uses.
          KEYSTORE_FILE      absolute path to the decoded dawasafe-new.jks
          KEYSTORE_PASSWORD  store password
          KEY_ALIAS          alias inside the store
          KEY_PASSWORD       password for that alias
        The workflow writes the keystore to the runner's temp directory (NOT
        into the checkout) and sets these four for the build step only.

     2. Gradle properties — for signed builds on your own machine. Put these in
        ~/.gradle/gradle.properties (on Windows: C:\Users\<you>\.gradle\
        gradle.properties), which lives outside the project and so cannot be
        committed by accident:
          dawasafe.storeFile=C:/Users/you/keys/dawasafe-new.jks
          dawasafe.storePassword=...
          dawasafe.keyAlias=...
          dawasafe.keyPassword=...

        Use FORWARD slashes in that path even on Windows. A .properties file
        treats backslash as an escape character, so C:\Users\you\keys becomes
        C:Usersyoukeys and the build then reports a keystore that is not there.

   If NONE of the four is set, the build still works: debug falls back to the
   local Android debug keystore, so a fresh clone can build and run without
   holding the release key. What it will not do is silently pretend — an
   unsigned release APK says so, loudly, below.

   If SOME but not all are set, that is a misconfigured secret rather than an
   intentional unsigned build, and it fails here instead of thirty lines into
   a Gradle stack trace.
   --------------------------------------------------------------------------- */
def dsSecret = { String envName, String propName ->
    def value = System.getenv(envName)
    if (!value?.trim() && project.hasProperty(propName)) {
        value = project.property(propName) as String
    }
    return value?.trim() ?: null
}

def dsStorePath     = dsSecret('KEYSTORE_FILE',     'dawasafe.storeFile')
def dsStorePassword = dsSecret('KEYSTORE_PASSWORD', 'dawasafe.storePassword')
def dsKeyAlias      = dsSecret('KEY_ALIAS',         'dawasafe.keyAlias')
def dsKeyPassword   = dsSecret('KEY_PASSWORD',      'dawasafe.keyPassword')

/* Resolve the path here rather than inside the signingConfig, so that a path
   that is set but wrong is reported as a missing FILE (with the absolute path
   it looked at) instead of as a missing password. A leading ~ is expanded
   because gradle.properties is hand-edited and people write ~ there; Gradle
   does not expand it for you and would create a literal "~" directory. */
def dsStoreFile = null
if (dsStorePath) {
    def expanded = dsStorePath.startsWith('~')
        ? System.getProperty('user.home') + dsStorePath.substring(1)
        : dsStorePath
    def candidate = new File(expanded)
    dsStoreFile = candidate.isAbsolute() ? candidate : project.file(expanded)
}

def dsProvided = [
    'KEYSTORE_FILE / dawasafe.storeFile'        : dsStorePath,
    'KEYSTORE_PASSWORD / dawasafe.storePassword': dsStorePassword,
    'KEY_ALIAS / dawasafe.keyAlias'             : dsKeyAlias,
    'KEY_PASSWORD / dawasafe.keyPassword'       : dsKeyPassword,
]
def dsMissing = dsProvided.findAll { !it.value }.keySet()

if (dsMissing.size() > 0 && dsMissing.size() < dsProvided.size()) {
    throw new GradleException(
        "Signing is half-configured, which is never on purpose.\n" +
        "Missing: " + dsMissing.join(', ') + "\n" +
        "Set all four (env vars in CI, or dawasafe.* in ~/.gradle/gradle.properties), " +
        "or none of them to build with the debug key.")
}
if (dsStorePath && !dsStoreFile?.isFile()) {
    throw new GradleException(
        "The keystore was named but is not there.\n" +
        "Looked at: ${dsStoreFile?.absolutePath}\n" +
        "In CI this means the decode step did not run or KEYSTORE_BASE64 is empty; " +
        "locally it means dawasafe.storeFile points somewhere stale.")
}

def dsSigningReady = dsStoreFile?.isFile() && dsStorePassword && dsKeyAlias && dsKeyPassword

android {
    namespace 'com.dawasafe.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dawasafe.app"

        /* minSdk 21 = Android 5.0 Lollipop (2014).
           This matches the app's own compatibility floor: the whole v7 pass was
           spent making the JavaScript parse on an old WebView. Going lower is
           not useful — Android 4.4's WebView cannot be updated from the Play
           Store, so it would be stuck at Chrome 33 forever. */
        minSdk 21
        targetSdk 34

        versionCode 8
        versionName "8.0"

        /* The app does its own translation in JavaScript (English, Hindi,
           Kannada) and stores the choice itself, so the only Android resources
           that need translating are the notification channel names the user sees
           in system Settings. Listing the three locales keeps the framework from
           packaging dozens of unused ones. */
        resConfigs "en", "hi", "kn"
    }

    signingConfigs {
        /* Declared only when the material actually exists. An always-present
           config with null fields is worse than no config: AGP accepts it at
           configuration time and then fails deep inside the signing task with
           a message that does not mention secrets at all. */
        if (dsSigningReady) {
            release {
                storeFile dsStoreFile
                storePassword dsStorePassword
                keyAlias dsKeyAlias
                keyPassword dsKeyPassword

                /* v1 (JAR) signing is what an Android 5 phone understands; v2
                   is what everything since Nougat prefers and verifies faster.
                   Both, because minSdk is 21. Assignment form rather than
                   `enableV1Signing true`, because these two are Boolean
                   properties and the method-style setter is not guaranteed. */
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        debug {
            /* Same key as release, when it is available, so you can move between
               the two builds on one phone without uninstalling (which would
               delete the medicine list). Without the key this quietly uses the
               standard Android debug keystore — fine for running the app, but a
               debug build signed that way will NOT install over a release
               build, and vice versa. */
            if (dsSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        release {
            if (dsSigningReady) {
                signingConfig signingConfigs.release
            }
            /* else: no signingConfig. Gradle emits app-release-unsigned.apk,
               which cannot be installed on a phone at all. That is the correct
               outcome for a build with no key — the CI workflow checks the
               signature before it uploads anything, so an unsigned APK can
               never reach someone's family as a download. */

            /* NOT minified. R8 would strip the @JavascriptInterface methods
               the WebView calls by name — the alarm bridge would compile fine
               and then silently do nothing at runtime, which for a medicine
               reminder is the single worst outcome. proguard-rules.pro keeps
               them anyway as a second line of defence if this is ever turned on. */
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    /* index.html is left COMPRESSED (i.e. no noCompress rule).

       An earlier version of this file excluded 'html' from compression, on the
       theory that the WebView could then mmap the asset instead of inflating it.
       That trade does not hold up: the file is mostly one enormous JavaScript
       object literal, so it compresses roughly 3.8 MB -> 1.2 MB, and leaving it
       uncompressed adds ~2.6 MB to an APK that people will be sending each other
       over WhatsApp on metered connections. What it buys back is one gzip inflate
       at launch, which is tens of milliseconds even on a slow phone.

       Small APK wins. If cold-start ever becomes the complaint, measure it before
       trading 2.6 MB for it. */

    compileOptions {
        /* Java 11, not 17. AGP 8.5 itself runs on JDK 17 — that is a separate
           thing from the language level compiled for the app, and at minSdk 21
           every extra language level is more desugaring between the source and
           what actually runs on an Android 5 phone. Nothing here needs past
           Java 11, so this is the shortest path to the device. */
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        /* Do not let a lint opinion break an APK build that someone is waiting on. */
        abortOnError false
        checkReleaseBuilds false
    }

    /* No packaging/excludes block: with zero dependencies there are no duplicate
       META-INF entries to resolve. Adding one "just in case" would be config that
       nobody can later tell is load-bearing or not. */
}

/* One line at the top of the log saying which key this build will use, because
   "why will this APK not install over the old one" is otherwise a very long
   afternoon. Never prints the passwords or the alias — a CI log is a public
   document on a public repository. */
gradle.projectsEvaluated {
    if (dsSigningReady) {
        logger.lifecycle("DawaSafe signing: release key from ${dsStoreFile.name} (provided at build time)")
    } else {
        logger.lifecycle("DawaSafe signing: NO release key provided.")
        logger.lifecycle("  debug   -> local Android debug keystore")
        logger.lifecycle("  release -> UNSIGNED (app-release-unsigned.apk, will not install on a phone)")
    }
}

/* ---------------------------------------------------------------------------
   The app itself: DawaSafe-v8.html, committed ONCE at the project root and
   copied into assets at build time.

   The obvious alternative is to commit it directly as
   app/src/main/assets/index.html. That means the same 3.8 MB file exists twice
   in the repository under two names, and nothing keeps them in step: someone
   updates the one they were given, rebuilds, and ships the other. A copy step
   makes the root file the single source of truth.

   If the source file is missing the build FAILS here, loudly. Letting it
   through would produce an APK that installs, launches, and shows a blank
   white screen - a failure that only appears on the phone, after the person
   has already sent it to their family.
   --------------------------------------------------------------------------- */
def webAppSource = rootProject.file("DawaSafe-v8.html")
def webAppTarget = layout.buildDirectory.dir("generated/dawasafe-assets")

def stageWebApp = tasks.register('stageWebApp', Copy) {
    from(webAppSource) { rename { 'index.html' } }
    into webAppTarget

    doFirst {
        if (!webAppSource.exists()) {
            throw new GradleException(
                "DawaSafe-v8.html is missing from the project root.\n" +
                "That file IS the app - without it the APK opens to a blank screen.\n" +
                "Expected at: ${webAppSource.absolutePath}")
        }
        // ~3.8 MB. Anything tiny is the wrong file, or a Git LFS pointer that
        // was never fetched (those are a few hundred bytes of text).
        if (webAppSource.length() < 1_000_000) {
            throw new GradleException(
                "DawaSafe-v8.html is only ${webAppSource.length()} bytes; the real " +
                "build is ~3.8 MB.\nThis is the wrong file, or Git LFS did not fetch it.")
        }
        // Search the whole file, not a prefix. An earlier version read only the
        // first 400 KB, on the assumption that a <script> near the top of the
        // document is near the top of the FILE. It is not: the local medicine
        // index is a single line of ~3.2 MB, so every v8 marker sits past
        // character 3,270,000. The check could never see what it was looking
        // for, and failed every build on a perfectly good file.
        //
        // Both markers are checked, because they are different blocks with
        // different failure modes: without the early one, speech and the state
        // restore are gone; without the late one there is no bridge at all and
        // reminders quietly stop when the app is closed.
        //
        // The whole 3.8 MB does land in memory here. That is deliberate - it
        // is what the previous version did too (getText() reads it all and
        // .take() only trimmed the copy), it is nothing to a Gradle JVM, and a
        // plain contains() cannot go subtly wrong the way a hand-rolled
        // streaming search can.
        def text = webAppSource.getText('UTF-8')
        def missing = []
        if (!text.contains('DS_TTS_NATIVE')) missing.add('the early block (DS_TTS_NATIVE)')
        if (!text.contains('DS_QA8')) missing.add('the late block (DS_QA8)')
        if (missing) {
            throw new GradleException(
                "DawaSafe-v8.html is missing " + missing.join(' and ') + ".\n" +
                "This looks like a pre-v8 export: dose reminders would never " +
                "reach Android, and would stop when the app is closed.")
        }
    }
}

android.sourceSets.main.assets.srcDir(webAppTarget)
tasks.named('preBuild') { dependsOn stageWebApp }

dependencies {
    /* intentionally empty — see the header comment */
}
