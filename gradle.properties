# DawaSafe Android — gradle.properties

# 2 GB is comfortably inside a GitHub-hosted runner (7 GB) and enough for a
# 3.8 MB asset + AAPT2. The default 512 MB has been known to OOM on aapt2.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# The build has exactly one module, so parallel/configure-on-demand buy nothing
# and only add nondeterminism to CI logs.
org.gradle.parallel=false
org.gradle.caching=true

# This project deliberately has ZERO third-party dependencies (see app/build.gradle),
# so AndroidX is not actually pulled in. The flags are set anyway because AGP 8
# warns loudly if they are absent, and a wall of warnings hides real errors.
android.useAndroidX=true
android.enableJetifier=false

# Keep the raw uncompressed HTML out of the "resources shrunk" path — we do not
# minify at all, but being explicit documents the intent.
android.nonTransitiveRClass=true
